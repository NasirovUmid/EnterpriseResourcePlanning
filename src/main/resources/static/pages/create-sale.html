<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Sale — ERP</title>
    <link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="page-shell">
    <div class="topbar">
        <div class="brand-block">
            <h1>Create Sale</h1>
            <p style="color:var(--muted);margin:6px 0 0;">Register a new sale transaction.</p>
        </div>
        <div class="nav-links">
            <a class="nav-pill" href="/pages/admin-panel.html#sales">← Back to Sales</a>
            <a class="nav-pill" href="/index.html">Home</a>
        </div>
    </div>
    <div style="max-width:520px;margin:0 auto;">
        <section class="panel">
            <span class="eyebrow">New Sale</span>
            <h2 class="section-title" style="margin-top:10px;">Sale details</h2>
            <form id="saleForm" class="form-grid" style="margin-top:18px;">
                <div class="input-row">
                    <label for="contractsId">Contract</label>
                    <select id="contractsId" required>
                        <option value="">Select a contract...</option>
                    </select>
                </div>
                <div class="input-row"><label for="totalPrice">Total Price</label><input id="totalPrice" type="number"
                                                                                         step="0.01"
                                                                                         placeholder="1000.00" required
                                                                                         min="0"></div>
                <div class="input-row"><label for="saleDate">Sale Date</label><input id="saleDate" type="datetime-local"
                                                                                     required></div>
                <div class="input-row">
                    <label for="status">Status</label>
                    <select id="status" required>
                        <option value="PENDING_PAYMENT">PENDING</option>
                        <option value="PAID">PAID</option>
                        <option value="CANCELLED">CANCELLED</option>
                    </select>
                </div>
                <div class="button-row">
                    <button class="btn btn-primary" type="submit">Create sale</button>
                    <a class="btn btn-secondary" href="/pages/admin-panel.html#sales">Cancel</a>
                </div>
            </form>
            <div id="formStatus" class="status-box" style="margin-top:14px;"></div>
        </section>
    </div>
</div>
<script src="/js/auth-pages.js"></script>
<script>
    const {
        authorizedFetch,
        formatError,
        getApiBase,
        getSession,
        guardPage,
        readJson,
        redirectToLogin,
        setStatus
    } = window.erpAuth;

    async function loadContracts() {
        try {
            const res = await authorizedFetch(getApiBase() + '/contracts?page=0&size=100', {method: 'GET'});
            const data = await readJson(res);
            if (!res.ok) throw data;
            const contracts = Array.isArray(data) ? data : (data && Array.isArray(data.content) ? data.content : []);
            const select = document.getElementById('contractsId');
            contracts.forEach(function (c) {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = (c.contractNumber || c.id) + ' ($' + (c.amount || 0) + ')';
                select.appendChild(opt);
            });
        } catch (e) {
            console.error('Failed to load contracts:', e);
        }
    }

    if (!getSession().accessToken && !getSession().refreshToken) {
        redirectToLogin();
    } else {
        guardPage(['ADMIN', 'MOD_SALES']).catch(console.error);
        loadContracts();
        document.getElementById('saleForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            setStatus('formStatus', 'Creating…', '');
            try {
                const res = await authorizedFetch(getApiBase() + '/sales', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contractsId: document.getElementById('contractsId').value,
                        totalPrice: parseFloat(document.getElementById('totalPrice').value),
                        date: new Date(document.getElementById('saleDate').value).toISOString(),
                        status: document.getElementById('status').value
                    })
                });
                const d = await readJson(res);
                if (!res.ok) throw d;
                setStatus('formStatus', '✓ Sale created successfully!', 'success');
                e.target.reset();
            } catch (err) {
                setStatus('formStatus', formatError(err), 'error');
            }
        });
    }
</script>
</body>
</html>
