<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Role — ERP</title>
    <link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="page-shell">
    <div class="topbar">
        <div class="brand-block">
            <h1>Create Role</h1>
            <p style="color:var(--muted);margin:6px 0 0;">Register a new system role.</p>
        </div>
        <div class="nav-links">
            <a class="nav-pill" href="/pages/admin-panel.html#roles">← Back to Roles</a>
            <a class="nav-pill" href="/index.html">Home</a>
        </div>
    </div>
    <div style="max-width:520px;margin:0 auto;">
        <section class="panel">
            <span class="eyebrow">New Role</span>
            <h2 class="section-title" style="margin-top:10px;">Role details</h2>
            <form id="roleForm" class="form-grid" style="margin-top:18px;">
                <div class="input-row"><label for="roleName">Role Name</label><input id="roleName" type="text" placeholder="e.g. MOD_SALES" required minlength="3" maxlength="20"></div>
                <div class="input-row">
                    <label for="roleStatus">Status</label>
                    <select id="roleStatus" required>
                        <option value="ACTIVE" selected>ACTIVE</option>
                        <option value="DEACTIVATED">DEACTIVATED</option>
                    </select>
                </div>
                <div class="button-row">
                    <button class="btn btn-primary" type="submit">Create role</button>
                    <a class="btn btn-secondary" href="/pages/admin-panel.html#roles">Cancel</a>
                </div>
            </form>
            <div id="formStatus" class="status-box" style="margin-top:14px;"></div>
        </section>
    </div>
</div>
<script src="/js/auth-pages.js"></script>
<script>
    const { authorizedFetch, formatError, getApiBase, getSession, guardPage, readJson, redirectToLogin, setStatus } = window.erpAuth;
    if (!getSession().accessToken && !getSession().refreshToken) { redirectToLogin(); }
    else {
        guardPage(['ADMIN','MOD_ROLES']).catch(console.error);
        document.getElementById('roleForm').addEventListener('submit', async function(e) {
            e.preventDefault(); setStatus('formStatus','Creating…','');
            try {
                const res = await authorizedFetch(getApiBase()+'/roles',{method:'POST',headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({name:document.getElementById('roleName').value.trim(),
                        status:document.getElementById('roleStatus').value})});
                const d = await readJson(res); if(!res.ok) throw d;
                setStatus('formStatus','✓ Role "'+d.name+'" created!','success');
                e.target.reset();
            } catch(err){ setStatus('formStatus',formatError(err),'error'); }
        });
    }
</script>
</body>
</html>
