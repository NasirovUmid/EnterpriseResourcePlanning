<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Change Password</title>
    <link rel="stylesheet" href="/css/auth-pages.css">
</head>
<body>
<div class="page-shell">
    <div class="topbar">
        <div class="brand-block">
            <h1>Change Password</h1>
            <p>Keep your account credentials current and secure.</p>
        </div>
        <div class="nav-links">
            <a class="nav-pill" href="/index.html">Home</a>
            <a class="nav-pill" href="/pages/profile.html">Profile</a>
            <a class="nav-pill" href="/pages/admin-panel.html">Admin panel</a>
            <a class="nav-pill" href="/pages/login.html">Login</a>
        </div>
    </div>

    <div class="hero-grid">
        <section class="panel">
            <span class="eyebrow">Security Update</span>
            <h2 class="section-title">Create a new password</h2>
            <p class="subtle">Choose a strong password that is not used elsewhere.</p>

            <form id="changePasswordForm" class="form-grid">
                <div class="input-row">
                    <label for="oldPassword">Old password</label>
                    <input id="oldPassword" type="password" minlength="8" maxlength="45" required>
                </div>

                <div class="input-row">
                    <label for="newPassword">New password</label>
                    <input id="newPassword" type="password" minlength="8" maxlength="45" required>
                </div>

                <div class="button-row">
                    <button class="btn btn-primary" type="submit">Save new password</button>
                    <a class="btn btn-secondary" href="/pages/profile.html">Back to profile</a>
                </div>
            </form>

            <div id="passwordStatus" class="status-box">Ready to update your password.</div>
        </section>
    </div>
</div>

<script src="/js/auth-pages.js"></script>
<script>
    const {
        authorizedFetch,
        formatError,
        getApiBase,
        getSession,
        readJson,
        saveSession,
        setStatus,
        redirectToLogin
    } = window.erpAuth;

    document.getElementById("changePasswordForm").addEventListener("submit", async function (event) {
        event.preventDefault();
        setStatus("passwordStatus", "Updating password...", "");

        try {
            const response = await authorizedFetch(getApiBase() + "/auth/password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    oldPassword: document.getElementById("oldPassword").value,
                    newPassword: document.getElementById("newPassword").value
                })
            });

            const payload = await readJson(response);
            if (!response.ok) {
                throw payload;
            }

            saveSession(payload, {userId: getSession().userId});
            document.getElementById("changePasswordForm").reset();
            setStatus("passwordStatus", "Password changed.", "success");
        } catch (error) {
            setStatus("passwordStatus", formatError(error), "error");
        }
    });

    if (!getSession().accessToken && !getSession().refreshToken) {
        redirectToLogin();
    }
</script>
</body>
</html>
